<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biko · Booking Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   BIKO · customer app prototype v6
   1 tokens · 2 service themes · 3 type · 4 base · 5 device · 6 components · 7 screens
   ===================================================================== */

/* ---------- 1. TOKENS ---------- */
:root{
  --y-100:#FFF1C7;--y-300:#FFD255;--y-500:#FFB80D;--y-600:#F29D00;
  --ink-900:#16130F;--ink-700:#3A342C;--ink-500:#6B655C;
  --ok:#1FB46E;--warn:#FF5A2E;--info:#3B82C4;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:30px;--r-pill:999px;
  --blur-1:8px;--blur-2:16px;--blur-3:28px;
  --d1:160ms;--d2:320ms;--d3:560ms;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --f:"Plus Jakarta Sans",system-ui,sans-serif;--m:"Geist Mono",ui-monospace,monospace;
}

/* ---------- 2. SERVICE THEMES (set on .phone[data-theme]) ---------- */
/* Biko + Tour: warm light, Biko yellow */
.phone{
  --bg:#F4F3EF;--surface:#FFFFFF;--surface-2:#ECEAE4;--text:#16130F;--text-2:#6B655C;--line:#E2DFD8;
  --acc:#FFB80D;--acc-2:#FFCB45;--acc-ink:#16130F;--acc-soft:#FFF1C7;--acc-t:#B87800;
  --glass:rgba(255,255,255,.74);--glass-line:rgba(255,255,255,.95);
  --sh-1:0 1px 2px #0000000a,0 6px 18px -10px #00000026;--sh-2:0 18px 40px -18px #00000040;
  --ok-ink:#0B7A47;--ok-bg:#1FB46E1F;--warn-ink:#C23A12;--warn-bg:#FF5A2E1A;--info-ink:#276199;--info-bg:#3B82C41F;
  --map-bg:#E8E5DE;--map-block:#DCD8CE;--map-road:#FFFFFF;--map-road2:#F6F4EF;--map-water:#BCD8E6;--map-park:#CDE2C0;
  color-scheme:light}
.phone[data-theme="tour"]{--map-park:#BFDDB0;--acc-soft:#FFEFC2}
/* Gig: night shift, electric lime */
.phone[data-theme="gigg"]{
  --bg:#0D0E0C;--surface:#181A16;--surface-2:#22251F;--text:#F1F3EC;--text-2:#9CA294;--line:#2C3028;
  --acc:#C6F432;--acc-2:#DAFF62;--acc-ink:#0D0E0C;--acc-soft:#C6F4321F;--acc-t:#C6F432;
  --glass:rgba(24,26,22,.74);--glass-line:rgba(255,255,255,.08);
  --sh-1:0 0 0 1px #ffffff0d;--sh-2:0 18px 40px -16px #000;
  --ok-ink:#5BD69A;--warn-ink:#FF8A66;--info-ink:#8DBDEB;
  --map-bg:#0A0B09;--map-block:#151713;--map-road:#2C3027;--map-road2:#1D201A;--map-water:#0E181C;--map-park:#131C15;
  color-scheme:dark}
/* Lux: graphite and champagne gold */
.phone[data-theme="lux"]{
  --bg:#0A0908;--surface:#161412;--surface-2:#211E1A;--text:#F4EEE4;--text-2:#A59A88;--line:#2C2823;
  --acc:#D9B26F;--acc-2:#EDCB8C;--acc-ink:#14110D;--acc-soft:#D9B26F1F;--acc-t:#D9B26F;
  --glass:rgba(22,20,18,.74);--glass-line:rgba(255,255,255,.07);
  --sh-1:0 0 0 1px #ffffff0b;--sh-2:0 18px 40px -16px #000;
  --ok-ink:#5BD69A;--warn-ink:#FF8A66;--info-ink:#8DBDEB;
  --map-bg:#0D0C0B;--map-block:#181614;--map-road:#322D27;--map-road2:#221F1B;--map-water:#11161A;--map-park:#161914;
  color-scheme:dark}

/* ---------- 3. TYPE SCALE (only font sizes in the app) ---------- */
.t-display{font:800 40px/44px var(--f);letter-spacing:-.03em}
.t-title{font:800 28px/32px var(--f);letter-spacing:-.025em;text-wrap:balance;margin:0}
.t-h{font:700 17px/22px var(--f);letter-spacing:-.015em;margin:0}
.t-body{font:500 16px/24px var(--f);margin:0}
.t-meta{font:500 13px/18px var(--f);margin:0}
.t-label{font:600 12px/16px var(--f)}
.t-btn{font:700 16px/20px var(--f)}
.t-num-xl{font:800 52px/56px var(--f);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.t-num-l{font:700 24px/28px var(--f);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.t-num{font:600 14px/20px var(--f);font-variant-numeric:tabular-nums}
.t-mono{font-family:var(--m);font-weight:500;letter-spacing:.01em}
.t-body b,.t-meta b{font-weight:700}.t-h b{font-weight:800}
.up{}
.mute{color:var(--text-2)}.ok-t{color:var(--ok-ink)}.warn-t{color:var(--warn-ink)}.brand-t{color:var(--acc-t)}

/* ---------- 4. BASE + UTILITIES ---------- */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#0f2f4a;color:#eee;font-family:var(--f)}
body::before{content:"";position:fixed;inset:-80px;z-index:-1;filter:blur(60px);background:radial-gradient(60% 50% at 20% 25%,#1d6fa8,transparent 70%),radial-gradient(50% 40% at 80% 20%,#0b4f7d,transparent 70%),radial-gradient(70% 45% at 30% 75%,#2f6b5c,transparent 70%),radial-gradient(60% 40% at 80% 85%,#3b4a36,transparent 70%),linear-gradient(180deg,#0d3d66,#1f4f4a 60%,#2b3a2e)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
input,textarea{font-family:var(--f)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.row.start{justify-content:flex-start}
.stack{display:grid;gap:var(--s3)}.stack-2{display:grid;gap:var(--s2)}.stack-4{display:grid;gap:var(--s4)}.stack-1{display:grid;gap:var(--s1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.center{text-align:center;justify-items:center}
.grow{flex:1;min-width:0}.flex-none{flex:none}.sp-top{margin-top:var(--s1)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes rot{to{rotate:360deg}}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px}.ic.xs{width:14px;height:14px}.ic.l{width:32px;height:32px}.ic.xl{width:44px;height:44px}

/* ---------- 5. STAGE + DEVICE ---------- */
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px var(--s4) 16px}
.simbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 24px;background:#1e1e1e;border-bottom:1px solid #000;z-index:10}
.simbar .dev{display:grid;gap:0}.simbar .dev b{font:700 15px/18px -apple-system,"SF Pro Text",var(--f);color:#fff}.simbar .dev span{font:400 12px/14px -apple-system,var(--f);color:#a1a1a1}
.ctrls{display:flex;gap:2px;padding:4px;border-radius:12px;background:#2a2a2a;box-shadow:inset 0 0 0 1px #3a3a3a}
.ctl{width:40px;height:34px;display:grid;place-items:center;border-radius:8px;color:#e8e8e8;transition:background var(--d2)}.ctl span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ctl:hover{background:#ffffff1f}
.fit{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:418px;height:890px;padding:8px;border-radius:66px;transform-origin:0 0;
  background:linear-gradient(145deg,#3c3c3f,#1c1c1e 30%,#2c2c2e 55%,#141416 80%,#38383a);box-shadow:0 40px 80px #0009,0 0 0 1px #000,inset 0 0 0 1.5px #5a5a5e,inset 0 0 3px #000}
.device::before,.device::after{content:"";position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1a1a1c,#4a4a4e)}
.device::before{left:-3px;top:19%;height:7%;box-shadow:0 70px 0 #2a2a2c,0 130px 0 #2a2a2c}
.device::after{content:"";position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3632,#8d877f)}
.device::before{left:-4px;top:19%;height:7%;box-shadow:0 70px 0 #6d6760,0 130px 0 #6d6760}
.device::after{right:-4px;top:28%;height:11%}
.phone{width:402px;height:874px;background:var(--bg);color:var(--text);border-radius:58px;border:0;position:relative;overflow:hidden;isolation:isolate;transition:background-color var(--d3),color var(--d3)}
.status{height:54px;position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font:600 15px/20px -apple-system,"SF Pro Text",var(--f);z-index:40;color:var(--text);transition:color var(--d2);pointer-events:none}
.status .sig{display:flex;gap:6px;align-items:center}
.phone.darkbar .status{color:#fff}
.homebar{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:136px;height:5px;border-radius:3px;background:var(--text);z-index:60;opacity:.85;pointer-events:none}
.sf{position:absolute;top:0;left:0;right:0;height:58px;z-index:35;pointer-events:none;background:linear-gradient(180deg,var(--bg) 35%,transparent);transition:opacity var(--d2)}
.phone.bleed .sf{opacity:0}
.bg{display:none}

/* dynamic island */
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:124px;height:36px;background:#000;border-radius:20px;z-index:70;color:#fff;overflow:hidden;
  transition:width var(--d3) var(--spring),height var(--d3) var(--spring),border-radius var(--d3) var(--spring);display:flex;align-items:center;padding:0 16px}
.island .in{display:flex;align-items:center;gap:var(--s3);width:100%;opacity:0;transition:opacity var(--d1);white-space:nowrap}
.island.open{width:370px;height:74px;border-radius:38px}
.island.open .in{opacity:1;transition-delay:.18s}
.isl-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.isl-tx{min-width:0;flex:1;display:grid}
.isl-tx b{color:#fff;font-weight:600}
.isl-tx small{color:#b9b4ac;overflow:hidden;text-overflow:ellipsis}

/* ---------- 6. COMPONENTS ---------- */
.view{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;padding:60px var(--s5) 128px;display:flex;flex-direction:column;gap:var(--s4);scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*{flex-shrink:0}
.view.dk{padding-bottom:0}
.view.mapmode{padding:0;overflow:hidden;display:block}
.view.f{animation:inF var(--d3) var(--ease)}.view.b{animation:inB var(--d3) var(--ease)}
@keyframes inF{from{opacity:0;transform:translateX(28px)}}
@keyframes inB{from{opacity:0;transform:translateX(-28px)}}
.st{animation:rise var(--d3) var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.view.still .st{animation:none}

.dock{position:sticky;bottom:0;margin:auto calc(var(--s5)*-1) 0;padding:var(--s4) var(--s5) 34px;z-index:5;display:grid;gap:var(--s3)}
.dock::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent,var(--bg) 45%)}

.press{position:relative;overflow:hidden;transition:transform var(--d1) var(--spring)}
.press:active{transform:scale(.97)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);white-space:nowrap;width:100%;min-height:56px;padding:0 var(--s5);border-radius:var(--r-pill);
  background:var(--text);color:var(--bg);font:700 16px/20px var(--f);transition:opacity var(--d2),background var(--d2),transform var(--d1) var(--spring)}
.btn.brand{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--warn);color:#fff}
.btn.light{background:#fff;color:var(--warn)}
.btn.sm{width:auto;min-height:40px;padding:0 var(--s4)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.busy{pointer-events:none}
.btn.busy::after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:rot .7s linear infinite}

.icon-btn{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:var(--glass);backdrop-filter:blur(var(--blur-2));box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line)}
.icon-btn .nd{position:absolute;top:12px;right:13px;width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;background:var(--acc);display:grid;place-items:center;font:700 17px/22px var(--f);color:var(--acc-ink)}
.avatar.lg{width:64px;height:64px}

.surface{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1)}
.surface.glass{background:var(--glass);backdrop-filter:blur(var(--blur-2))}
.surface.dark{background:#16130F;color:#F4EEE4;border-radius:var(--r-xl);padding:var(--s5)}
.surface.gold{background:var(--acc);color:var(--acc-ink);border-radius:var(--r-xl);padding:var(--s5)}
.surface.gold .btn{background:var(--acc-ink);color:var(--acc)}.surface.gold .btn.ghost{background:#ffffff59;color:var(--acc-ink)}
.surface.tap{width:100%;text-align:left}

.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden;display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center;min-height:64px;padding:var(--s3) var(--s4);text-align:left;width:100%;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--line)}
.li .main{display:grid;min-width:0}
.li.tap:active{background:var(--surface-2)}
.li .end{display:flex;align-items:center;gap:var(--s2);color:var(--text-2)}
.li.unread b{font-weight:700}

.tile{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.tile.sm{width:36px;height:36px;border-radius:var(--r-sm)}.tile.lg{width:56px;height:56px;border-radius:18px}
.tile.y,.tile.acc{background:var(--acc-soft);color:var(--acc-t)}.tile.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tile.info{background:var(--info-bg);color:var(--info-ink)}.tile.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tile.dark{background:var(--text);color:var(--bg)}.tile.violet{background:#2a2420;color:#D9B26F}.tile.mint{background:#0D0E0C;color:#C6F432}

.badge{display:inline-flex;align-items:center;gap:var(--s1);padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.info{background:var(--info-bg);color:var(--info-ink)}.badge.brand{background:var(--acc-soft);color:var(--acc-t)}
.badge.dark{background:var(--glass);color:var(--text)}.badge .ic{width:14px;height:14px}

.field{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:0 6px 0 var(--s5);border-radius:var(--r-pill);background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow var(--d2)}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--text)}
.field.err{box-shadow:inset 0 0 0 1.5px var(--warn)}
.field.ok{box-shadow:inset 0 0 0 1.5px var(--ok)}
.field input,.field textarea{flex:1;min-width:0;border:0;background:none;outline:0;color:inherit;padding:0}
.field input::placeholder,.field textarea::placeholder{color:var(--text-2)}
.field textarea{resize:none;padding:var(--s3) 0}
.field .pre{display:flex;align-items:center;gap:var(--s2);font-weight:500;flex:none}
.field .okc{display:none;color:var(--ok);margin-right:12px}.field.valid .okc{display:block}
.field.ta{align-items:flex-start;border-radius:var(--r-lg)}
.err-msg{display:flex;gap:6px;align-items:flex-start;color:var(--warn-ink);padding-left:var(--s5)}
.err-msg .ic{margin-top:1px}

.banner{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:var(--warn-bg);color:var(--warn-ink)}
.banner.info{background:var(--info-bg);color:var(--info-ink)}.banner.ok{background:var(--ok-bg);color:var(--ok-ink)}.banner.brand{background:var(--acc-soft);color:var(--text)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-pill);padding:4px;position:relative}
.seg .si{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));background:var(--surface);border-radius:var(--r-pill);
  transition:transform var(--d3) var(--spring),background var(--d3);transform:translateX(calc(var(--k)*100%));box-shadow:0 2px 8px -2px #0003}
.phone:not([data-theme="biko"]):not([data-theme="tour"]) .seg .si{background:var(--acc)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:var(--r-pill);font:500 14px/18px var(--f);color:var(--text-2);transition:color var(--d2)}
.seg button.on{color:var(--text);font-weight:600}
.phone:not([data-theme="biko"]):not([data-theme="tour"]) .seg button.on{color:var(--acc-ink)}
.seg .ic{width:16px;height:16px}

.opt{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);min-height:64px;width:100%;text-align:left;border-radius:var(--r-lg);background:var(--surface);
  box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow var(--d2)}
.opt .main{display:grid;min-width:0}
.opt.on{box-shadow:inset 0 0 0 2px var(--text)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all var(--d2) var(--spring);color:var(--bg)}
.radio .ic{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(.4);transition:all var(--d2) var(--spring)}
.opt.on .radio{background:var(--text);border-color:var(--text)}.opt.on .radio .ic{opacity:1;transform:none}

.toggle{width:50px;height:30px;border-radius:var(--r-pill);background:var(--line);position:relative;transition:background var(--d2);flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform var(--d2) var(--spring)}
.toggle[aria-checked="true"]{background:var(--ok)}.toggle[aria-checked="true"]::after{transform:translateX(20px)}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.chip{padding:14px;border-radius:var(--r-pill);background:var(--surface-2);text-align:center;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow var(--d2)}
.chip.on{box-shadow:inset 0 0 0 2px var(--text)}

.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-sm)}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:52px;height:52px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--acc);animation:rot .8s linear infinite}
.empty{display:grid;justify-items:center;text-align:center;gap:var(--s3);padding:var(--s6) var(--s4)}
.empty svg.art{width:190px;height:auto}

.sheet{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade var(--d2)}
.sheet-pn{position:relative;width:100%;max-height:90%;overflow-y:auto;scrollbar-width:none;border-radius:32px 32px 0 0;padding:0 var(--s5) 38px;
  background:var(--surface);color:var(--text);box-shadow:var(--sh-2);display:grid;gap:var(--s4);align-content:start;animation:up var(--d3) var(--ease)}
.sheet-pn::-webkit-scrollbar{display:none}
.grab{height:26px;display:grid;place-items:center;touch-action:none;cursor:grab;margin:0 calc(var(--s5)*-1)}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet.out .sheet-pn{animation:down var(--d2) var(--ease) forwards}
.sheet.out .sheet-bd{animation:fadeout var(--d2) forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadeout{to{opacity:0}}
.sheet-art{display:grid;place-items:center;padding-top:var(--s2)}
canvas.confetti{display:none}
.flash{position:absolute;inset:0;background:#fff;z-index:80;animation:flash .45s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}

/* floating tab bar */
.tabs{position:absolute;left:var(--s4);right:var(--s4);bottom:24px;height:68px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:var(--r-pill);
  background:var(--glass);backdrop-filter:blur(var(--blur-3)) saturate(1.6);box-shadow:var(--sh-2),inset 0 0 0 1px var(--glass-line);
  transition:transform var(--d3) var(--ease),opacity var(--d2),background var(--d3)}
.tabs[hidden]{display:grid!important;transform:translateY(130%);opacity:0;pointer-events:none}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:var(--r-pill);background:var(--acc);transition:transform var(--d3) var(--spring),opacity var(--d2),background var(--d3);z-index:0}
.tabs button{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:1px;color:var(--text-2);transition:color var(--d2);border-radius:var(--r-pill)}
.tabs button.on{color:var(--acc-ink)}
.tabs button .ic{width:22px;height:22px}

/* swipe-to-confirm: pill with round knob */
.swipe{position:relative;height:64px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--acc),var(--acc-2));overflow:hidden;touch-action:none;user-select:none;flex:none}
.swipe .fill{position:absolute;inset:0;width:0;background:#0000001a}
.swipe .lbl{position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;font:600 16px/20px var(--f);color:var(--acc-ink)}
.swipe::after{content:"›››";position:absolute;right:24px;top:50%;translate:0 -52%;font:600 22px/22px var(--f);letter-spacing:-1px;color:var(--acc-ink);animation:chev 1.6s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:.7;transform:translateX(4px)}}
.swipe .knob{position:absolute;top:6px;left:6px;width:52px;height:52px;border-radius:50%;background:var(--acc-ink);display:grid;place-items:center;color:var(--acc);cursor:grab;z-index:2;box-shadow:0 4px 10px #0003}
.swipe.done .knob{background:var(--ok);color:#fff}
.swipe.snap .knob,.swipe.snap .fill{transition:all var(--d2) var(--spring)}

/* ---------- 7. SCREENS ---------- */
.splash{position:absolute;inset:0;background:#F4F3EF;z-index:65;overflow:hidden;transition:opacity .45s var(--ease)}
.splash.go{opacity:0}
.splash .stagebox{position:absolute;left:0;right:0;top:330px;height:140px}
.splash .road{position:absolute;left:0;right:0;top:118px;height:3px;background:repeating-linear-gradient(90deg,#16130F 0 22px,transparent 22px 40px);opacity:.18;animation:roadmove .9s linear 3,fade .3s both}
@keyframes roadmove{to{background-position:-40px 0}}
.splash .rider{position:absolute;left:50%;top:0;width:200px;margin-left:-100px;animation:ridein 1.15s .15s cubic-bezier(.22,.9,.3,1) both}
@keyframes ridein{0%{transform:translateX(-360px)}78%{transform:translateX(8px)}100%{transform:translateX(0)}}
.splash .rider svg{display:block;overflow:visible;animation:bounce .35s 1.2s ease-out}
@keyframes bounce{40%{transform:translateY(3px) rotate(.8deg)}}
.splash .lines{position:absolute;left:-70px;top:44px;display:grid;gap:10px;animation:lines 1.15s .15s ease-out both}
.splash .lines i{display:block;height:3px;border-radius:2px;background:#16130F;opacity:.25}
.splash .lines i:nth-child(1){width:46px}.splash .lines i:nth-child(2){width:70px;margin-left:-18px}.splash .lines i:nth-child(3){width:38px;margin-left:8px}
@keyframes lines{0%,70%{opacity:1}100%{opacity:0;transform:translateX(-30px)}}
.splash .beam{position:absolute;left:calc(50% + 58px);top:9px;width:180px;height:60px;transform-origin:0 50%;background:radial-gradient(ellipse at 0 50%,#FFD255cc,#FFB80D33 45%,transparent 70%);opacity:0;animation:beam .7s 1.3s ease-out both}
@keyframes beam{0%{opacity:0;transform:scaleX(.3)}35%{opacity:1;transform:scaleX(1)}100%{opacity:.35;transform:scaleX(1)}}
.splash .word{position:absolute;left:0;right:0;top:500px;text-align:center}
.splash .name{font:800 44px/48px var(--f);letter-spacing:.08em;color:#16130F;animation:wordin .6s 1.55s var(--spring) both}
.splash .tag{font:500 13px/18px var(--f);letter-spacing:.24em;text-transform:uppercase;color:#8A8378;margin-top:4px;animation:rise .5s 1.7s var(--ease) both}
@keyframes wordin{from{opacity:0;transform:translateY(14px) scale(.92);letter-spacing:.3em}}

/* welcome */
.hero{margin:-60px calc(var(--s5)*-1) 0;padding:76px var(--s6) 0;min-height:300px;background:var(--y-500);border-radius:0 0 36px 36px;position:relative;overflow:hidden;color:var(--ink-900)}
.hero .hero-eb{opacity:.65}
.hero .art{position:absolute;left:0;bottom:0;width:100%;height:auto}
.hero p{max-width:200px;margin-top:var(--s2);font-weight:500}
.svc{display:grid;grid-template-columns:56px 1fr auto;gap:var(--s3);align-items:center;width:100%;text-align:left;box-shadow:inset 0 0 0 2px transparent,var(--sh-1);transition:box-shadow var(--d2),transform var(--d1) var(--spring)}
.svc.on{box-shadow:inset 0 0 0 2px var(--text),var(--sh-1)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--bg);transition:all var(--d2) var(--spring)}
.chk .ic{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(.4);transition:all var(--d2) var(--spring)}
.svc.on .chk{background:var(--text);border-color:var(--text)}.svc.on .chk .ic{opacity:1;transform:none}

/* otp */
.otpbox{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);position:relative}
.otpbox span{height:68px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font:600 28px/32px var(--f);transition:box-shadow var(--d2),transform var(--d2) var(--spring)}
.otpbox span.cur{box-shadow:inset 0 0 0 2px var(--text)}
.otpbox span.fill{transform:scale(1.04)}
.otpbox span.okk{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}
.otpbox span.bad{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.otpbox input{position:absolute;inset:0;opacity:0;font-size:16px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.keypad button{height:54px;border-radius:var(--r-pill);background:var(--surface);font:500 22px/26px var(--f);color:var(--text)}
.keypad button .ic{margin:auto}

/* kyc */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.steps i{height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform var(--d3) var(--ease)}
.steps i.on::after{transform:none}
.scanner{height:224px;border-radius:var(--r-xl);background:#0E0D0B;position:relative;overflow:hidden;display:grid;place-items:center}
.scanner .scan-art{width:220px;height:auto;filter:drop-shadow(0 10px 24px #000a);transition:transform var(--d3) var(--ease)}
.scanner.busy .scan-art{transform:scale(1.03)}
.scanner .laser{position:absolute;left:36px;right:36px;height:2px;border-radius:2px;background:var(--y-500);box-shadow:0 0 14px 2px var(--y-500);animation:laser 1.2s ease-in-out infinite alternate}
.scanner.busy .laser{animation-duration:.5s}
@keyframes laser{from{top:16%}to{top:84%}}
.scanner .corner{position:absolute;width:28px;height:28px;border:3px solid #fff;transition:border-color var(--d2)}
.scanner.bad .corner{border-color:var(--warn)}.scanner.bad .laser{display:none}
.scanner .c1{left:44px;top:22px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.scanner .c2{right:44px;top:22px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.scanner .c3{left:44px;bottom:22px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.scanner .c4{right:44px;bottom:22px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanner .hint{position:absolute;bottom:10px;left:50%;translate:-50% 0;padding:4px 12px;border-radius:var(--r-pill);background:#ffffff1f;color:#fff;white-space:nowrap}
.scanner.off{background:var(--surface-2);color:var(--text)}
.doc{display:grid;grid-template-columns:44px 1fr auto;gap:var(--s3);align-items:center}
.burst{width:88px;height:88px;margin:0 auto}
.burst svg{width:100%;height:100%}
.burst circle{stroke-dasharray:283;stroke-dashoffset:283;animation:draw .6s .1s var(--ease) forwards}
.burst path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .55s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* full-screen map (home + ride) */
.mapfull{position:absolute;inset:0;background:var(--map-bg);overflow:hidden}
.mapfull svg.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.m-bg{fill:var(--map-bg)}.m-block{fill:var(--map-block)}.m-park{fill:var(--map-park)}.m-water{fill:var(--map-water)}
.m-road{fill:none;stroke:var(--map-road);stroke-linecap:round}.m-road2{fill:none;stroke:var(--map-road2);stroke-linecap:round}
.m-route{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--acc))}
.m-route-dash{stroke-dasharray:1 14;stroke-width:6}
.m-label{fill:var(--text-2);font:500 9px var(--f);letter-spacing:.12em;opacity:.7}
.halo{position:absolute;left:50%;top:var(--cy,38%);translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,transparent 55%,color-mix(in srgb,var(--acc) 22%,transparent) 100%);box-shadow:0 0 0 1.5px var(--acc),0 0 30px 2px color-mix(in srgb,var(--acc) 35%,transparent);transition:width 1s var(--ease),height 1s var(--ease)}
.halo::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--acc);animation:ping 2.8s ease-out infinite}
@keyframes ping{from{transform:scale(.7);opacity:.8}to{transform:scale(1.2);opacity:0}}
.me{position:absolute;left:50%;top:var(--cy,38%);translate:-50% -50%;width:22px;height:22px;border-radius:50%;background:var(--acc);border:4px solid #fff;z-index:3;box-shadow:0 2px 10px #0005}
.approx{position:absolute;left:50%;top:var(--cy,38%);translate:-50% -50%;width:150px;height:150px;border-radius:50%;border:1.5px dashed var(--text-2);background:color-mix(in srgb,var(--text-2) 12%,transparent);z-index:3}
.mk{position:absolute;translate:-50% -50%;display:flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:4px 10px 4px 4px;z-index:2;white-space:nowrap;
  background:var(--glass);backdrop-filter:blur(var(--blur-1));color:var(--text);box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line);
  animation:pop .5s var(--spring) both;animation-delay:calc(var(--i)*60ms + .2s);transition:opacity .6s,filter .6s}
.mk i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.mk .ic{width:13px;height:13px;stroke-width:2.2}
.mk.st i{background:var(--acc);color:var(--acc-ink)}.mk.sw i{background:var(--ok);color:#fff}
.mk.out{opacity:.35;filter:grayscale(1)}
.ftop{position:absolute;top:56px;left:var(--s4);right:var(--s4);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);z-index:6}
.pill{display:flex;align-items:center;gap:var(--s2);height:48px;padding:0 var(--s4) 0 6px;border-radius:var(--r-pill);background:var(--glass);backdrop-filter:blur(var(--blur-2));box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line);color:var(--text);min-width:0}
.pill .avatar{width:36px;height:36px;font-size:15px}
.pill.pad{padding:0 var(--s4)}
.mapchip{position:absolute;left:50%;translate:-50% 0;top:116px;display:flex;align-items:center;gap:var(--s3);padding:8px 14px;border-radius:var(--r-pill);background:var(--glass);backdrop-filter:blur(var(--blur-2));box-shadow:var(--sh-1),inset 0 0 0 1px var(--glass-line);z-index:5;white-space:nowrap;color:var(--text)}
.mapchip b{color:var(--text)}
.mapchip .sep{width:1px;height:16px;background:var(--line)}
.locchip{position:absolute;right:var(--s4);top:calc(38% + 90px);z-index:5}
.msheet{position:absolute;left:0;right:0;bottom:0;max-height:56%;overflow-y:auto;scrollbar-width:none;z-index:7;background:var(--bg);border-radius:32px 32px 0 0;padding:0 var(--s4) 112px;
  display:flex;flex-direction:column;gap:var(--s3);box-shadow:0 -12px 40px -16px #0006;animation:up var(--d3) var(--ease)}
.msheet::-webkit-scrollbar{display:none}
.msheet>*{flex-shrink:0}
.msheet .grab{margin:0;height:22px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 0 #1fb46e88;animation:live 1.4s infinite}
@keyframes live{to{box-shadow:0 0 0 10px #1fb46e00}}

.strip{border-radius:var(--r-lg);padding:var(--s3);display:grid;grid-template-columns:auto 1fr;gap:0 var(--s3);align-items:center;background:var(--surface);box-shadow:var(--sh-1)}
.strip .tile{grid-row:span 3;background:var(--acc-soft);color:var(--acc-t)}

/* scooter cards: info left, art right */
.bcard{display:grid;grid-template-columns:1fr 132px;gap:var(--s2);align-items:center;width:100%;text-align:left;padding:var(--s4) var(--s3) var(--s4) var(--s4);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);animation:rise var(--d3) var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.bcard .info{display:grid;gap:6px;min-width:0}
.bcard .meta{display:flex;gap:var(--s2);flex-wrap:wrap}
.bcard .art{display:grid;place-items:center;height:90px;border-radius:var(--r-md);background:radial-gradient(circle at 50% 60%,var(--surface-2),transparent 70%)}
.bcard .art svg{transition:transform var(--d3) var(--spring)}.bcard:hover .art svg{transform:translateX(4px)}
.batt{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}.batt i{display:block;height:100%;background:var(--ok);transition:width .8s var(--ease)}

/* scooter detail: studio look */
.showcase{height:260px;margin:0 calc(var(--s5)*-1);display:grid;place-items:center;flex:none;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 55%,var(--surface),transparent 70%)}
.showcase svg.bk{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.ring{--p:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--ok)) calc(var(--p)*1%),var(--surface-2) 0);transition:--p 1s var(--ease)}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:center}
.spec{background:var(--surface);border-radius:var(--r-lg);padding:var(--s3);text-align:center;box-shadow:var(--sh-1);display:grid;gap:2px;justify-items:center}

/* time dial */
.dialwrap{display:grid;place-items:center;touch-action:none}
.dial{width:250px;height:250px;position:relative;cursor:grab;border-radius:50%}
.dial svg{width:100%;height:100%;overflow:visible}
.dial .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.dial .c b{display:inline-block;transition:transform var(--d1) var(--spring)}
.dial .c b.bump{transform:scale(1.12)}
.d-track{stroke:var(--surface-2)}.d-arc{stroke:var(--acc)}.d-tick{stroke:var(--line)}
#knob{fill:var(--text);stroke:var(--acc);transition:r var(--d1) var(--spring);filter:drop-shadow(0 4px 8px #0004)}
.dial:active #knob{r:22}
.bill{display:grid;gap:var(--s2)}
.bill .tot{border-top:1px dashed var(--line);padding-top:var(--s3)}
.bill .num{font-weight:600;font-variant-numeric:tabular-nums}

.qr{width:176px;height:176px;margin:0 auto;background:#fff;padding:12px;border-radius:var(--r-lg);box-shadow:var(--sh-1);position:relative;overflow:hidden}

/* ride */
.stat{background:var(--surface);border-radius:var(--r-lg);padding:10px var(--s3);display:grid;gap:2px;box-shadow:var(--sh-1)}
.alert{background:var(--warn);color:#fff;border-radius:var(--r-lg);padding:var(--s4);display:grid;gap:var(--s3);animation:pop .5s var(--spring)}
.swapviz{display:grid;place-items:center;gap:var(--s3);padding:var(--s2) 0}
.cell{width:90px;height:150px;border-radius:18px;border:4px solid var(--text);position:relative;padding:6px;display:flex;align-items:flex-end}
.cell::before{content:"";position:absolute;top:-12px;left:50%;translate:-50% 0;width:34px;height:10px;border-radius:4px 4px 0 0;background:var(--text)}
.cell i{display:block;width:100%;border-radius:10px;background:var(--ok);height:8%;transition:height 1.5s var(--ease)}

/* return */
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.photos button{aspect-ratio:1;border-radius:var(--r-lg);border:1.5px dashed var(--text-2);background:var(--surface);display:grid;place-items:center;align-content:center;gap:2px;padding:4px;transition:all var(--d2)}
.photos button.done{border:1.5px solid var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.tl{display:grid}
.tl div{display:grid;grid-template-columns:24px 1fr auto;gap:var(--s2);align-items:start;padding-bottom:var(--s4);position:relative}
.tl div:last-child{padding-bottom:0}
.tl div::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:2px;transition:all var(--d2) var(--spring)}
.tl div.d::before{background:var(--ok);border-color:var(--ok)}
.tl div:not(:last-child)::after{content:"";position:absolute;left:7px;top:22px;bottom:0;width:2px;background:var(--line)}

/* invest */
.chart{display:flex;align-items:flex-end;gap:var(--s2);height:140px;padding-top:var(--s3)}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-height:0}
.chart i{flex:none}
.chart i{width:100%;background:var(--surface-2);border-radius:8px;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i)*60ms);transform-origin:bottom}
.chart div:last-child i{background:var(--acc)}
@keyframes grow{from{transform:scaleY(0)}}
.chart small{color:var(--text-2)}


/* intro carousel (Kites-style: art on soft white + black card) */
.intro{position:absolute;inset:0;background:var(--bg)}
.intro-art{position:absolute;left:0;right:0;top:40px;height:470px;touch-action:pan-y}
.intro-art .slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateX(40px);transition:opacity var(--d3) var(--ease),transform var(--d3) var(--ease);pointer-events:none}
.intro-art .slide.on{opacity:1;transform:none}
.intro-art .slide.prev{transform:translateX(-40px)}
.intro-art svg{width:360px;height:auto}
.iscoot{position:absolute;left:50%;top:50%;width:360px;translate:-50% -50%;overflow:visible;pointer-events:none}
#isc{transition:transform .8s cubic-bezier(.5,0,.2,1)}
.irider{opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .45s var(--spring)}.irider.on{opacity:1;transform:none}
.fly{position:absolute;z-index:66;pointer-events:none}.fly svg{display:block;width:100%;height:100%;overflow:visible}
.intro-skip{position:absolute;top:58px;right:var(--s5);z-index:3}
.intro-card{position:absolute;left:var(--s3);right:var(--s3);bottom:var(--s3);border-radius:36px;background:#16130F;color:#fff;padding:var(--s8) var(--s6) var(--s6);display:grid;gap:var(--s5);text-align:center;justify-items:center;animation:up var(--d3) var(--ease)}
.intro-card p{color:#B9B2A8;max-width:290px}
.intro-card .txt{display:grid;gap:var(--s2);transition:opacity var(--d1)}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:#ffffff40;transition:all var(--d2) var(--spring)}.dots i.on{width:24px;background:var(--y-500)}
.intro-card .row{width:100%}.intro-card .btn{flex:1;width:auto}
.btn.dk{background:#ffffff14;color:#fff}
.logo{display:inline-flex;align-items:center;gap:6px;background:var(--y-500);color:var(--ink-900);font:800 20px/24px var(--f);letter-spacing:.04em;padding:8px 14px;border-radius:14px}

/* ===== premium polish pass: depth, hairlines, refined controls ===== */
.phone{--hair:color-mix(in srgb,var(--text) 7%,transparent);--hair-2:color-mix(in srgb,var(--text) 11%,transparent);--hi:inset 0 1px 0 #ffffffb3;
  --sh-1:0 0 0 1px var(--hair),0 1px 2px #0000000a,0 10px 24px -14px #00000026;--sh-2:0 0 0 1px var(--hair),0 24px 48px -20px #00000040}
.phone[data-theme="gigg"],.phone[data-theme="lux"]{--hi:inset 0 1px 0 #ffffff12;--sh-1:0 0 0 1px #ffffff0f,0 1px 0 #ffffff0a inset,0 12px 28px -16px #000;--sh-2:0 0 0 1px #ffffff12,0 28px 56px -20px #000}
/* buttons */
.btn{min-height:54px;letter-spacing:-.005em;transition:transform var(--d1) var(--spring),box-shadow var(--d2),background var(--d2),opacity var(--d2)}
.btn.brand{background:linear-gradient(180deg,var(--acc-2),var(--acc));box-shadow:var(--hi),0 1px 0 #0000001a,0 10px 22px -10px color-mix(in srgb,var(--acc) 85%,transparent)}
.btn.brand:active{box-shadow:inset 0 2px 6px #00000026;transform:scale(.98)}
.btn:not(.brand):not(.ghost):not(.danger):not(.light){background:linear-gradient(180deg,color-mix(in srgb,var(--text) 88%,var(--bg)),var(--text));box-shadow:inset 0 1px 0 #ffffff26,0 10px 22px -12px #0000004d}
.btn.ghost{background:var(--surface);box-shadow:0 0 0 1px var(--hair-2),0 1px 2px #0000000a}
.btn.danger{background:linear-gradient(180deg,#FF7148,var(--warn));box-shadow:inset 0 1px 0 #ffffff40,0 10px 22px -10px #ff5a2e99}
.btn.sm{min-height:40px;font-size:14px}
.btn .ic{stroke-width:2.1}
.icon-btn{box-shadow:0 0 0 1px var(--hair),0 6px 16px -8px #00000033,var(--hi)}

.surface,.list,.bcard,.spec,.stat,.bsum,.pcard,.rtsum,.hstrip,.strip,.bpick,.opt,.chip{border-radius:22px}
.surface,.list,.bcard,.spec,.stat,.bsum,.pcard,.rtsum,.hstrip:not(.live),.strip,.bpick{box-shadow:var(--sh-1)}
.li{min-height:66px;padding:12px 16px}
.li+.li::before{left:72px;right:16px;background:var(--hair)}
.li.tap{transition:background var(--d1)}.li.tap:hover{background:color-mix(in srgb,var(--text) 3%,transparent)}
.opt{box-shadow:0 0 0 1px var(--hair-2)}.opt.on{box-shadow:0 0 0 2px var(--text),0 8px 20px -12px #0000004d}
/* icon tiles */
.tile{border-radius:14px;box-shadow:inset 0 0 0 1px var(--hair),var(--hi)}
.tile.y,.tile.acc{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 22%,var(--surface)),color-mix(in srgb,var(--acc) 12%,var(--surface)))}

.ic{stroke-width:1.7}.ic.xs{stroke-width:2.2}.ic.s{stroke-width:1.9}.ic.l,.ic.xl{stroke-width:1.5}

.badge{padding:4px 10px;letter-spacing:.005em;box-shadow:inset 0 0 0 1px var(--hair)}
.badge.ok{box-shadow:inset 0 0 0 1px #1FB46E2e}.badge.warn{box-shadow:inset 0 0 0 1px #FF5A2E2e}.badge.brand{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent)}

.chart{position:relative;background:repeating-linear-gradient(180deg,transparent 0 calc(25% - 1px),color-mix(in srgb,var(--text) 7%,transparent) calc(25% - 1px) 25%) 0 0/100% calc(100% - 22px) no-repeat}
.chart i{border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,color-mix(in srgb,var(--text) 12%,var(--surface)),color-mix(in srgb,var(--text) 6%,var(--surface)))}

.chart div{position:relative}
.chart i{position:relative}.cv{position:absolute;left:50%;translate:-50% 0;bottom:calc(100% + 6px);font-style:normal;white-space:nowrap;padding:3px 8px;border-radius:999px;background:var(--text);color:var(--bg);animation:pop .4s .5s var(--spring) both}
.chart small{color:var(--text-2);font-weight:600}
/* bars + progress */
.bbig{box-shadow:inset 0 1px 2px #00000014}.bbig i{background-image:linear-gradient(180deg,#ffffff40,transparent)!important}
.batt{height:5px}.batt i{border-radius:3px}
/* Phosphor duotone: solid glyph in currentColor, soft inner layer tinted with the service accent */
.ic{fill:currentColor;stroke:none}
.ic.lin{width:24px;height:24px}
.duo{fill:var(--duo,currentColor);opacity:var(--duo-o,.22)}
.tile.y .ic,.tile.acc .ic,.chk .ic,.lvb .ic{--duo:var(--acc)}
.tile .ic,.li .ic,.opt .ic,.badge .ic,.btn .ic,.pill .ic,.seg .ic,.chip2 .ic,.icon-btn .ic{--duo:color-mix(in srgb,var(--acc) 70%,currentColor);--duo-o:.35}
.tabs .ic{--duo:var(--acc);--duo-o:.0}.tabs button.on .ic{--duo-o:.55;--duo:#fff}
.isl-ic .ic,.mk .ic,.lvb .ic{--duo-o:.35;--duo:#fff}
.ic.xs{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== Layout rhythm: one gutter, 4px grid gaps, consistent text metrics ===== */
:root{--gut:20px}
body,#phone{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
#phone :is(h1,h2,h3,h4,p){margin:0}
#phone :is(.t-title,.t-display,.t-h){text-wrap-style:balance}
#phone :is(.t-body,.t-meta){text-wrap-style:pretty;overflow-wrap:break-word}
.t-meta{letter-spacing:0}.t-label{letter-spacing:.01em}
.t-body+.t-meta,.t-h+.t-meta,.t-h+.t-body{margin-top:2px}
.seg button{font:600 14px/20px var(--f)}
/* gutters */
.ftop,.stg.hm .ftop,.stg.bd .ftop,.stg.bk .ftop,.stg.pd .ftop,.stg.rd .ftop,.stg.rt .ftop{top:56px;left:var(--gut);right:var(--gut)}
.cbar{padding-left:var(--gut);padding-right:var(--gut)}
.stg .copy{left:24px;right:24px}
.hctl{left:var(--gut);right:var(--gut);gap:16px}
.tabs{left:var(--gut);right:var(--gut)}
/* vertical rhythm (16px between stacked blocks) */
.stg.sliv.hm .hctl{top:636px}
.hmore{top:744px;gap:24px}
.bstats{top:560px}.bstats.pfstats{top:458px}
.hstrip{top:176px}.hprops{top:244px}
.bpick{top:624px;padding:12px 16px}
.ivtag{top:304px}.ivbody{top:344px;gap:16px}
.wact{gap:12px}
.trlist{padding:8px var(--gut) 120px}
.ivbody,.bkbody{gap:16px}
.pcard{padding:16px}
.hstrip{padding:8px 16px 8px 8px}
/* cards & rows: comfortable inner spacing, aligned text */
.list .li{min-height:56px}
.li :is(.t-body,.t-meta){min-width:0}
.badge{line-height:16px}
.btn{min-height:54px}.btn.sm{min-height:40px}
/* ===== micro animations v2 ===== */
/* progress bars fill in when they appear */
@keyframes barIn{from{width:0}}
:is(.nfprog .bar i,.ncbat .bar i,.ivu .bar i,.lv-bar i,.amtrack .amcur){animation:barIn .9s .15s var(--ease) both}
.rtsegs i.on::before{animation:segIn .5s var(--ease) both}@keyframes segIn{from{transform:scaleX(0);transform-origin:left}}
/* sheet content cascades in */
.sheet:not(.out) .sheet-pn>*:not(.grab):not(.sstage){animation:rise .45s var(--ease) both}
.sheet:not(.out) .sheet-pn>*:nth-child(3){animation-delay:.04s}.sheet:not(.out) .sheet-pn>*:nth-child(4){animation-delay:.08s}.sheet:not(.out) .sheet-pn>*:nth-child(5){animation-delay:.12s}.sheet:not(.out) .sheet-pn>*:nth-child(6){animation-delay:.16s}.sheet:not(.out) .sheet-pn>*:nth-child(n+7){animation-delay:.2s}
/* pressed rows tint like iOS cells */
:is(.txr.pfr,.pyo,.lgc,.spt,.cpc,.amc,.bkopt,.spqb,.svc2,.ivshare button):active{background-color:color-mix(in srgb,var(--text) 5%,var(--surface))}
/* desktop hover lift */
@media (hover:hover){:is(.ncard,.tcard,.nfc,.kpi,.bc2,.svc2,.lgc,.spt,.amc):hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px #0004,var(--sh-1)}
  :is(.ncard,.tcard,.nfc,.kpi,.bc2,.svc2,.lgc,.spt,.amc){transition:transform .25s var(--spring),box-shadow .25s,background-color .2s}}
/* status pills pop when they change */
:is(.cpc.on .cpst,.kcr.done .kcs,.nfdone,.tcst,.tkst,.badge.ok){animation:pillIn .45s var(--spring) both}@keyframes pillIn{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* number bump when a live value changes */
.bump{animation:bump .38s var(--spring)}@keyframes bump{40%{transform:scale(1.08);color:var(--acc-t)}}
:is(#tot,#rkm,#rsp,#rbatt,#bal,#tick,#amto,#swp,#rcount,#dq){display:inline-block}
/* unread bell dot breathes */
.icon-btn .nd:not([hidden]){animation:ndp 2.4s ease-in-out infinite}@keyframes ndp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 50%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
/* collapsed header gets a hairline when content scrolls under it */
.cbar.on{box-shadow:0 1px 0 var(--hair),0 8px 18px -14px #0005}
/* empty-state art floats */
.empty svg.art,.empty .tile.lg{animation:float 3.2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}
/* radio + checkbox check draws with a spring */
.radio .ic,.chk .ic{transition:opacity .2s,transform .35s var(--spring)}
/* icon buttons rotate-press */
.icon-btn{transition:transform .18s var(--spring),background .2s}.icon-btn:active{transform:scale(.9)}
/* inputs: label/field focus glow eases */
.field{transition:box-shadow .25s var(--ease),background .2s}
/* segment indicator gets a little overshoot */
.seg .si{transition:transform .42s var(--spring),width .3s var(--ease)}
.pshot.press,.pshot{overflow:visible!important}.pshot .ring2{box-sizing:border-box;overflow:hidden}
.pshot.done .ring2{transform:none!important;border:0;background:var(--ok);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent),0 6px 14px -6px var(--ok)}
.pshot.done .ring2 .ic{animation:pop .4s var(--spring)}
/* screens without the tab bar: dock actions to the bottom */
.notabs .stg.bd .bdcopy{top:498px}.notabs .bdk{top:566px}.notabs .stg.bd .bpick{top:657px}.notabs .bcta{bottom:44px}
.notabs .ractions{bottom:40px}.notabs .rmini{height:216px}.notabs .stg.rd.low .ralert{top:540px}
.notabs .trlist{padding-bottom:48px}.notabs .msheet{padding-bottom:40px}
.tabs button.on .ic{--duo:var(--acc-ink);--duo-o:.35}
.island.open.tall{height:94px;border-radius:44px}
.island.tall .isl-tx small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:15px}
.island.tall .isl-tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.island.pring .isl-pr{display:none}
/* ===== service scenes (How do you want to ride?) ===== */
.svscene{position:absolute;left:0;right:0;top:40px;height:256px;pointer-events:none;opacity:0;transition:opacity .5s;z-index:0;overflow:hidden;-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.stg.st-service .svscene{opacity:1}
.svscene .sv{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:translateY(14px) scale(1.04);transition:opacity .55s var(--ease),transform .8s var(--ease)}
.stg[data-svc="tour"] .sv-tour,.stg[data-svc="gigg"] .sv-gig,.stg[data-svc="lux"] .sv-lux{opacity:1;transform:none}
.sv-tour .birds{animation:birds 9s linear infinite}@keyframes birds{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.sv-tour .sun{animation:sunp 4s ease-in-out infinite;transform-origin:300px 96px}@keyframes sunp{50%{transform:scale(1.08)}}
.sv-tour .palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite}.sv-tour .palm.r{animation-delay:-1.8s}@keyframes sway{50%{transform:rotate(1.6deg)}}
.sv-tour .waves{animation:wave 3s ease-in-out infinite}@keyframes wave{50%{transform:translateX(6px)}}
.sv-gig .route{animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}
.sv-gig .pin{animation:pinb 1.6s ease-in-out infinite}.sv-gig .pin.p2{animation-delay:-.8s}@keyframes pinb{50%{translate:0 -5px}}
.sv-gig .win rect{animation:winf 2.4s steps(2) infinite}.sv-gig .win rect:nth-child(odd){animation-delay:-1.2s}@keyframes winf{50%{opacity:.25}}
.sv-lux .stars path,.sv-lux .stars circle{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}.sv-lux .stars :nth-child(2n){animation-delay:-1.3s}.sv-lux .stars :nth-child(3n){animation-delay:-.7s}@keyframes tw{50%{opacity:.3;transform:scale(.6)}}
.stg.st-service .scoot,.stg.st-service .road,.stg.st-service .copy{z-index:1}
.kmb{white-space:nowrap;display:inline-flex;align-items:baseline;gap:0}
.tcfoot{padding-top:12px}.tcfoot .tcpay{display:grid;justify-items:start;gap:0}
.tcrc{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);color:var(--text);font-weight:700;transition:background .2s}
.tcard:active .tcrc{background:color-mix(in srgb,var(--acc) 22%,var(--surface))}
.stg .otpf .otpbox{grid-template-columns:repeat(4,64px)!important;justify-content:center!important;gap:14px!important}.stg .otpf .otpbox span{width:64px!important;height:64px!important;border-radius:14px!important}
</style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const V=$("#view"),TABS=$("#tabs"),PH=$("#phone"),BGL=$("#bg");
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
/* Solar mix: bold duotone by default (tiles, rows, island); linear for small inline icons and chrome buttons ("s", "xs", "lin") */
const ic=(n,c="")=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}${/(^| )(s|xs|lin)( |$)/.test(c)?"-l":""}"/></svg>`;
const bd=(txt,kind="",icon="")=>`<span class="badge t-label ${kind}">${icon?ic(icon):""}${txt}</span>`;
const PHONE_RE=/^[6-9]\d{9}$/,OTP_CODE="4821",COUPONS=["WELCOME15","BIKO10"];

/* ================= SOUND (Web Audio, no assets) ================= */
let AC=null,muted=false,BUS=null,REV=null;
/* master bus: gentle compressor + soft room reverb so every cue sits at the same loudness */
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;
    const mg=AC.createGain();mg.gain.value=.6;comp.connect(mg).connect(AC.destination);BUS=comp;
    const len=AC.sampleRate*1.1,ir=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
    REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.22;REV.connect(rg).connect(comp)}catch{return null}}
  if(AC.state==="suspended")AC.resume();return AC}
function route(c,node,o){let n=node;if(o.lp){const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=o.lp;n.connect(f);n=f}
  if(o.pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p}
  n.connect(BUS);if(o.rev){const g=c.createGain();g.gain.value=o.rev;n.connect(g).connect(REV)}}
function tone(f,d=.08,type="sine",v=.12,when=0,to=null,o={}){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+when;
  const os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(to)os.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.006));g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);route(c,g,o);os.start(t);os.stop(t+d+.03)}
function noise(d=.15,v=.2,f=2000,when=0,q=1,fTo=null,o={}){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+when;
  const b=c.createBuffer(1,Math.max(1,c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
  const sr=c.createBufferSource();sr.buffer=b;const fl=c.createBiquadFilter();fl.type="bandpass";fl.frequency.setValueAtTime(f,t);if(fTo)fl.frequency.exponentialRampToValueAtTime(fTo,t+d);fl.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);sr.connect(fl).connect(g);route(c,g,o);sr.start(t)}
/* bell = sine + inharmonic partials: soft, glassy UI chime */
function bell(f,d=.5,v=.07,when=0,rev=.3){tone(f,d,"sine",v,when,null,{rev,a:.004});tone(f*2.01,d*.55,"sine",v*.32,when,null,{rev});tone(f*3.92,d*.22,"sine",v*.1,when,null,{rev})}
const click=(v=.16,f=3200)=>noise(.014,v,f,0,1.4);
const GATE={};const gate=(k,ms)=>{const n=performance.now();if(GATE[k]&&n-GATE[k]<ms)return false;GATE[k]=n;return true};
/* haptics: Apple-HIG style vocabulary. selection = detents, impact = physical contact, notification = outcomes.
   Rate-limited per kind so fast gestures never turn into a buzz. Has its own setting (Profile > Haptics), separate from sound. */
const HAPT={select:[3],light:[6],soft:[9],medium:[12],rigid:[7],heavy:[18],success:[8,70,16],warning:[16,90,16],error:[20,50,20,50,26]};
const HGAP={select:30,light:45,soft:60,medium:80,rigid:60,heavy:120,success:300,warning:300,error:300};
const buzz=ms=>{try{if(navigator.userActivation?.hasBeenActive&&navigator.vibrate)navigator.vibrate(ms)}catch{}};
function hap(k){if(typeof S!=="undefined"&&S&&S.haptics===false)return;const p=HAPT[k];if(!p)return;if(!gate("h-"+(HAPT[k].length>1?"n":k),HGAP[k]))return;buzz(p);
  if(k==="error"||k==="warning"||k==="success"||k==="heavy"){const d=document.getElementById("device");if(!d)return;d.classList.remove("hx-"+k);void d.offsetWidth;d.classList.add("hx-"+k);setTimeout(()=>d.classList.remove("hx-"+k),420)}}
/* ===== EV scooter motor (sound-designed, not an engine) =====
   Layers: low electrical hum + speed-tracking motor whine (with 2nd harmonic) + tyre/road rumble (brown noise, low-passed).
   Everything is low-passed and quiet; pitch, brightness and level follow speed; 5.5 Hz wobble keeps it alive. */
let ROAD=null;
function roadBuf(c){if(ROAD)return ROAD;const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}return ROAD=b}
const MOTOR={n:null};
function motorStart(){if(muted||MOTOR.n)return;const c=ac();if(!c)return;const t=c.currentTime;
  const out=c.createGain();out.gain.value=0;out.connect(BUS);const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1600;lp.Q.value=.5;lp.connect(out);
  const hum=c.createOscillator();hum.type="triangle";hum.frequency.value=60;const hg=c.createGain();hg.gain.value=.35;hum.connect(hg).connect(lp);
  const wh=c.createOscillator();wh.type="sine";wh.frequency.value=380;const wg=c.createGain();wg.gain.value=.16;wh.connect(wg).connect(lp);
  const w2=c.createOscillator();w2.type="sine";w2.frequency.value=764;const w2g=c.createGain();w2g.gain.value=.035;w2.connect(w2g).connect(lp);
  const rn=c.createBufferSource();rn.buffer=roadBuf(c);rn.loop=true;const rf=c.createBiquadFilter();rf.type="lowpass";rf.frequency.value=420;const rg=c.createGain();rg.gain.value=.55;rn.connect(rf).connect(rg).connect(out);
  const lfo=c.createOscillator();lfo.frequency.value=5.5;const lg=c.createGain();lg.gain.value=5;lfo.connect(lg).connect(wh.frequency);
  const all=[hum,wh,w2,rn,lfo];all.forEach(o=>o.start(t));out.gain.setTargetAtTime(.035,t,.5);MOTOR.n={out,hum,wh,w2,rf,all}}
function motorSpeed(k,low){const n=MOTOR.n;if(!n)return;const t=AC.currentTime,r=Math.max(0,Math.min(1,k/60))*(low?.8:1),f=260+r*560;
  n.wh.frequency.setTargetAtTime(f,t,.6);n.w2.frequency.setTargetAtTime(f*2.01,t,.6);n.hum.frequency.setTargetAtTime(52+r*40,t,.6);
  n.rf.frequency.setTargetAtTime((300+r*800)*(low?.7:1),t,.6);n.out.gain.setTargetAtTime(k>0?.028+r*.04:.01,t,.5)}
function motorStop(){const n=MOTOR.n;if(!n)return;MOTOR.n=null;const t=AC.currentTime;n.out.gain.cancelScheduledValues(t);n.out.gain.setTargetAtTime(0,t,.3);
  n.wh.frequency.setTargetAtTime(180,t,.4);setTimeout(()=>{n.all.forEach(o=>{try{o.stop()}catch{}});n.out.disconnect()},1600)}
/* one-shot: the scooter pulls away / passes (whine swells up then eases, rumble follows) */
function driveFx(d=1,peak=1){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime;
  const out=c.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.06*peak,t+d*.35);out.gain.setTargetAtTime(0,t+d*.55,d*.18);
  const pan=c.createStereoPanner?c.createStereoPanner():null;if(pan){pan.pan.setValueAtTime(-.5,t);pan.pan.linearRampToValueAtTime(.5,t+d);out.connect(pan).connect(BUS)}else out.connect(BUS);
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1500;lp.connect(out);
  const wh=c.createOscillator();wh.type="sine";wh.frequency.setValueAtTime(240,t);wh.frequency.exponentialRampToValueAtTime(720*peak,t+d*.45);wh.frequency.exponentialRampToValueAtTime(420,t+d);
  const wg=c.createGain();wg.gain.value=.5;wh.connect(wg).connect(lp);
  const h=c.createOscillator();h.type="triangle";h.frequency.setValueAtTime(55,t);h.frequency.linearRampToValueAtTime(85,t+d*.5);const hg=c.createGain();hg.gain.value=.5;h.connect(hg).connect(lp);
  const rn=c.createBufferSource();rn.buffer=roadBuf(c);const rf=c.createBiquadFilter();rf.type="lowpass";rf.frequency.setValueAtTime(300,t);rf.frequency.linearRampToValueAtTime(900,t+d*.45);const rg=c.createGain();rg.gain.value=.9;rn.connect(rf).connect(rg).connect(out);

(function(){const I=document.getElementById("island");if(!I)return;let y0=null,pausedAt=0;

intro:()=>stageHTML(S.slide??0),

kyc:()=>stageHTML("kyc"),
home:()=>S.homeMap?homeMapHTML():homeStageHTML(),

bike:()=>bikeStageHTML(),
book:()=>{const v=SVC[S.svc];return`
  <div class="stg bk" id="stg">
    <div class="ftop">${backBtn}<span class="pill pad"><b class="t-body">${S.bike.name}</b><span class="t-meta mute">${S.bike.station}</span></span><span style="width:48px"></span></div>
    <div class="road" id="broad"></div>
    <div class="scoot arrive" id="ksc"><svg viewBox="0 -6 160 106" aria-hidden="true"><g id="sbody">${scooterInner(col(S.bike))}</g><g class="fx"><ellipse class="hlight" cx="130" cy="25" rx="10" ry="7" fill="#FFE27A"/><circle class="blight" cx="16" cy="49.5" r="7" fill="#FF5A2E"/></g></svg></div>
    <div class="bkbody">
      <h1 class="t-title">How long do you need it?</h1>
      ${v.units.length>1?`<div class="seg" id="units" style="--n:${v.units.length};--k:${v.units.indexOf(S.unit)}"><span class="si"></span>${v.units.map(u=>`<button data-u="${u}" class="${S.unit===u?"on":""}">${u}</button>`).join("")}</div>`:""}
      <div class="dialwrap"><div class="dial" id="dial" role="slider" tabindex="0" aria-label="Rental length" aria-valuemin="1" aria-valuemax="${v.max[S.unit]}">
        <svg viewBox="0 0 250 250"><g id="ticks"></g><circle class="d-track" cx="125" cy="125" r="100" fill="none" stroke-width="20"/>
        <circle id="arc" class="d-arc" cx="125" cy="125" r="100" fill="none" stroke-width="20" stroke-linecap="round" transform="rotate(-90 125 125)" stroke-dasharray="628.3"/>
        <circle id="knob" r="18" stroke-width="5"/></svg>
        <div class="c"><div><b class="t-num-xl" id="dq"></b><div class="t-h" id="du"></div><div class="t-meta mute" id="dr"></div></div></div></div></div>
      <div class="bkcard"><button class="bkhead press" id="bsum"><span class="stack-1" style="gap:0;text-align:left"><span class="t-label mute" id="totLbl">To pay</span><b class="t-num-l" id="tot"></b></span><span class="bkview t-meta">View bill${ic("chevron","xs")}</span></button>
        <div class="bkbrk" id="bsub"></div>
        <div class="bkrow"><button class="bkopt press" id="payM"><span class="tile xs y" id="payIc">${ic(payIcon(),"xs")}</span><span class="stack-1" style="gap:0;min-width:0"><small class="t-label mute">Pay with</small><span class="t-meta" id="payTxt">${payLabel()}</span></span></button><button class="bkopt press ${S.couponOk?"ok":""}" id="cpChip"><span class="tile xs ok">${ic("tag","xs")}</span><span class="stack-1" style="gap:0;min-width:0"><small class="t-label mute">Offer</small><span class="t-meta" id="cpTxt">${S.couponOk?S.coupon+" applied":"Add coupon"}</span></span></button></div></div>
    </div>
    <div class="swipe bkswipe" id="paySwipe"><div class="fill"></div><div class="lbl" id="payLbl"></div><div class="knob">${ic("arrow-right")}</div></div>
  </div>`},
paid:()=>`
  <div class="stg pd" id="stg">
    <div class="ftop">${bd(S.pay==="station"?"Reserved":"Paid","ok","check")}<span class="t-num t-mono mute">#${S.bid}</span></div>
    <div class="plock"><div class="chipx" id="pchip"><span class="sw"><span class="lk a">${ic("lock","s")}</span><span class="lk b">${ic("unlock","s")}</span></span><span class="sw"><b class="t-body a">Locked</b><b class="t-body b">Unlocked</b></span></div></div>
    <div class="road"></div>
    <div class="scoot" id="psc"><svg viewBox="0 -6 160 106" aria-hidden="true"><path class="kick" d="M72 70L64 88" stroke="#2A2724" stroke-width="3" stroke-linecap="round"/><g id="sbody">${scooterInner(col(S.bike))}</g><g class="fx"><ellipse class="hlight" cx="130" cy="25" rx="10" ry="7" fill="#FFE27A"/><circle class="blight" cx="16" cy="49.5" r="7" fill="#FF5A2E"/></g></svg></div>
    <div class="copy pdcopy"><h1 class="t-title">${S.pay==="station"?"Scooter reserved":"You're booked!"}</h1><p class="t-body">Show this code at Biko ${S.bike.station}. Staff hand over the keys and 2 helmets.</p></div>
    <div class="pcard tkt"><div class="tkhead"><div class="pqr">${qrSVG()}</div>
        <div class="tkid"><span class="tkst t-label"><i></i>Ready for pickup</span><b class="t-h">${S.bike.name}</b><span class="t-meta mute"><span class="t-mono">${S.bike.reg}</span></span><small class="t-label mute">Booking <span class="t-mono">#${S.bid}</span></small></div></div>

function bikesHTML(){
  if(!S.bikesReady)return[0,1].map(i=>`<div class="bcard" style="--i:${i}" aria-hidden="true"><div class="info"><div class="skel" style="height:20px;width:70%"></div><div class="skel" style="height:14px;width:50%"></div><div class="skel" style="height:4px"></div><div class="skel" style="height:18px;width:40%"></div></div><div class="skel" style="height:90px"></div></div>`).join("");
  const v=SVC[S.svc],u=v.units.at(-1);
  return BIKES.map((b,i)=>{const r=Math.round(b.batt*KMPCT),lo=b.batt<=30,walk=Math.max(1,Math.round(parseFloat(b.dist)*(b.dist.includes("km")?12:.012)));return`
    <button class="bcard bc2 press" style="--i:${i};--tc:${col(b)}" data-b="${i}">
      <span class="ncart">${scooterSVG(col(b),104)}<span class="ncdist t-label">${ic("pin","xs")}${b.dist}</span></span>
      <span class="info"><span class="row" style="gap:6px"><b class="t-body">${b.name}</b>${i===0?`<span class="badge t-label ok">Closest</span>`:""}</span>
        <span class="t-meta mute">${b.station} · ${walk} min walk</span>
        <span class="ncbat"><span class="bar ${lo?"lo":""}"><i style="width:${b.batt}%"></i></span><small class="t-label mute">${b.batt}% · ~${r} km range</small></span>
        <span class="ncfoot"><span><b class="t-num">${inr(v.rate[u])}</b><small class="t-label mute"> /${v.unit}</small></span><span class="bcgo t-label">Book${ic("arrow-right","xs")}</span></span></span></button>`}).join("")}
function activeCard(){return`<button class="surface tap press row" id="toRide" style="box-shadow:inset 0 0 0 2px var(--y-500),var(--e1)"><span class="stack-2"><span>${bd("Active now","warn")}</span><b class="t-h">${S.bike.name}</b><span class="t-meta mute">${S.bike.reg}</span></span>${ic("arrow-right")}</button>`}
const tripCard=(t,i)=>`
    <button class="tcard press" data-trip="${i}" style="--i:${i};--tc:${t.c}">
      <div class="tchead"><span class="tcart">${scooterSVG(t.c,62)}</span>

        <span class="tcst t-label">${ic("check","xs")}Completed</span></div>
      <div class="tcroute"><span class="tcdots"><i></i><b></b><i class="to"></i></span>
        <span class="tcstops"><span><b class="t-meta">${t.from||"Biko MG Road"}</b><small class="t-label mute">${t.d}${t.t0?" · "+t.t0:""}</small></span>
        <span><b class="t-meta">${t.to||"Biko MG Road"}</b><small class="t-label mute">${t.t1?t.t1:"Returned"}</small></span></span></div>
      <div class="tcstats"><span>${ic("route","xs")}<b class="t-num">${t.km} km</b></span><span>${ic("clock","xs")}<b class="t-num">${t.dur}</b></span><span>${ic("bolt","xs")}<b class="t-num">${t.swaps} swap${t.swaps===1?"":"s"}</b></span></div>
      <div class="tcfoot"><span class="tcpay"><b class="t-num-l">${inr(t.p)}</b><small class="t-label mute">${t.disc?`Saved ${inr(t.disc)} · `:""}Paid via UPI</small></span><span class="tcrc t-label">${ic("receipt","xs")}Receipt</span></div>
    </button>`;
function tripListHTML(){const f=S.tripFilter;
  const groups=[];S.trips.forEach((t,i)=>{const m=t.m||"October";let g=groups.find(x=>x[0]===m);if(!g)groups.push(g=[m,[],0,0]);g[1].push(tripCard(t,i));g[2]+=t.p;g[3]+=t.km});
  const past=S.trips.length?groups.map(([m,c,amt,km])=>`<section class="tgroup"><div class="nfh"><span class="t-label">${m}</span><span class="t-label mute">${km} km · ${inr(amt)}</span></div>${c.join("")}</section>`).join(""):`<div class="empty">${emptyArt()}<h2 class="t-h">No past trips yet</h2><p class="t-body mute">Finished rides and receipts appear here.</p></div>`;
  if(f==="Active")return S.ride?activeCard():`<div class="empty">${emptyArt()}<h2 class="t-h">No active ride</h2><p class="t-body mute">Pick a scooter near you and it will show up here while you ride.</p><button class="btn brand sm press" data-go="home">Find a scooter</button></div>`;
  if(f==="Past")return past;
  return(S.ride?activeCard():"")+past}
const txRow=x=>{const ref=x.t.match(/^Referral · (\w+)/),bk=/^Booking/.test(x.t),dep=/refund/i.test(x.t),add=/^Added/.test(x.t),pos=x.a>0;
  const lead=ref&&FRIEND[ref[1]]?`<span class="nfav sm"><img src="${FRIEND[ref[1]]}" alt=""><i class="tile y">${ic("gift","xs")}</i></span>`
   :`<span class="tile ${bk?"":pos?"ok":""} ${add?"info":""} ${dep?"warn":""}">${ic(bk?"scooter":dep?"shield":add?"card":pos?"gift":"wallet")}</span>`;
  const kind=ref?"Referral reward":bk?"Ride payment":dep?"Deposit":add?"Top-up · UPI":pos?"Bonus":"Payment";
  return`<div class="txr">${lead}<span class="main"><b class="t-body">${ref?ref[1]+" rode with your code":x.t}</b><span class="t-meta mute">${kind} · ${x.sub}</span></span>
   <span class="txa"><b class="t-num ${pos?"ok-t":""}">${pos?"+":"−"}${inr(Math.abs(x.a))}</b>${x.st?`<small class="t-label txp">${x.st}</small>`:`<small class="t-label mute">${pos?"Credited":"Debited"}</small>`}</span></div>`};

function qrSVG(){let s='<svg viewBox="0 0 21 21" width="100%" height="100%" shape-rendering="crispEdges" aria-label="Pickup QR code">';let seed=7;const r=()=>(seed=seed*16807%2147483647)/2147483647;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    const on=f?((x%14===0||x%14===6||y%14===0||y%14===6)||(x%14>=2&&x%14<=4&&y%14>=2&&y%14<=4)):r()>.5;if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#1F1712"/>`}
  return s+"</svg>"}

/* micro: bump live numbers when their text changes */
(function(){const ids=new Set(["tot","rkm","rsp","rbatt","bal","tick","amto","swp","rcount","dq"]),last=new WeakMap();
  new MutationObserver(ms=>{for(const m of ms){let el=m.target.nodeType===3?m.target.parentElement:m.target;while(el&&el!==PH&&!ids.has(el.id))el=el.parentElement;
    if(!el||el===PH)continue;const t=performance.now();if(last.get(el)>t-350)continue;last.set(el,t);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}})
  .observe(PH,{subtree:true,childList:true,characterData:true})})();
